    background-color: #fff;

    .month {
      background-color: #2f5d5d;
      color: #fff;
      text-align: center;
      padding: 40px 0;
      font-size: 36px;
      font-weight: bold;
    }

    /* Calendar */
    .calendar {
      width: 90%;
      max-width: 500px;
      margin: 20px auto;
      border-collapse: collapse;
      text-align: center;
    }

    .calendar th {
      font-weight: normal;
      padding: 10px;
      border-bottom: 1px solid #2f5d5d;
    }

    .calendar td {
      padding: 15px;
    }

    .calendar tr:not(:last-child) td {
      border-bottom: 1px solid #ccc;
    }
  </style>
