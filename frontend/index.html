<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login for Almaconnect</title>
    <link rel="stylesheet" href="Singin.css">
</head>

<body>
    <section>
        <div class="login-box">
            <form id="loginForm">
                <h2>Login</h2>

                <!-- Email -->
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail"></ion-icon></span>
                    <input type="email" id="email" required>
                    <label>Email</label>
                </div>

                <!-- Password -->
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                    <input type="password" id="password" required>
                    <label>Password</label>
                </div>

                <div class="remember-forgot">
                    <label><input type="checkbox" id="remember"> Remember me</label>
                </div>

                <button type="submit">Login</button>

                <p id="result" style="color: red; margin-top: 10px;"></p>
            </form>
        </div>
    </section>

    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons.js"></script>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const urlprod = "https://tuhin-school-project.onrender.com/api/login";
            const urldev = "http://localhost:3000/api/login";
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch(urlprod, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {

                    document.getElementById("result").style.color = "green";
                    document.getElementById("result").innerText = "Login successful! Welcome " + data.email;
                    // Login successful → redirect
                    localStorage.setItem('userId', data.id);
                    window.location.href = "home.html"; // 
                    // Redirect to dashboard if needed
                    // window.location.href = "dashboard.html";
                } else {
                    document.getElementById("result").style.color = "red";
                    document.getElementById("result").innerText = data.error;
                }
            } catch (err) {
                document.getElementById("result").style.color = "red";
                document.getElementById("result").innerText = "Server error, try again later";
                console.error(err);
            }
        });
    </script>
</body>

</html>
