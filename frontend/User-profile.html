    <title>User profile creation for Almaconnect</title>

</head>
<body>
    <section>
    <div class="registeration">
        <form action="register">
            <h2>Registeration</h2>
            <div class="input-box">
                <span class="icon"><ion-icon name="mail"></ion-icon></span>
                <input type="text" required>
                <label>Course</label>
            </div>
            <div class="input-box">
                <span class="icon"><ion-icon name="mail"></ion-icon></span>
                <input type="text" required>
                <label>Student/Alumnus</label>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox">Registered</label>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
    </section>
